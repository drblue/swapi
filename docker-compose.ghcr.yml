services:
  app:
    image: ${SWAPI_IMAGE:-ghcr.io/drblue/swapi:latest}
    restart: unless-stopped
    env_file:
      - ${SWAPI_ENV_FILE:-.env.docker}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - swapi_storage:/var/www/html/storage

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ${SWAPI_ENV_FILE:-.env.docker}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - swapi_mysql:/var/lib/mysql

volumes:
  swapi_mysql:
  swapi_storage:
